name: OCR experiment
on:
  push:
    branches: [experiment/ocr]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ocr-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m ocr_lab.smoke_test

      - run: python -m ocr_lab.layout_test
