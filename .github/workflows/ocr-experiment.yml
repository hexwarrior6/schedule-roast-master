name: OCR experiment
on:
  push:
    branches: [experiment/ocr]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ocr-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.5
      - run: uv sync --no-dev
      - run: uv run python -c "import cv2, importlib.metadata as m; assert not any(d.metadata['Name'].lower() == 'opencv-python' for d in m.distributions()); print(cv2.__version__)"
      - run: uv run python -m ocr_lab.smoke_test

      - run: uv run python -m ocr_lab.layout_test
      - run: uv run python -m ocr_lab.topology_test
